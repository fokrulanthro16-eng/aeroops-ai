name: Avionics & Flight Readiness Test Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Deterministic Physics, Risk & Avionics Test Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Deterministic Avionics & Cryptographic Test Matrix
        run: npm test

      - name: Build Next.js Production Cockpit
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          GEMINI_API_KEY: "mock_ci_key"